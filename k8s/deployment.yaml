apiVersion: apps/v1
kind: Deployment
metadata:
  name: study-hive-deployment
  labels:
    app: study-hive
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: study-hive
  template:
    metadata:
      labels:
        app: study-hive
      annotations:
        # Autodiscovery instructions for Prometheus
        prometheus.io/scrape: "true"
        prometheus.io/port: "9113"
    spec:
      containers:
      # Container 1: StudyHive frontend served by Nginx
      - name: study-hive
        image: aradhyabhardwaj/study-hive:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
            
      # Container 2 (Sidecar): Nginx Prometheus Exporter
      - name: nginx-exporter
        image: nginx/nginx-prometheus-exporter:0.11.0
        args:
        - -nginx.scrape-uri=http://127.0.0.1/nginx_status
        ports:
        - containerPort: 9113
          name: exporter
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "64Mi"
            cpu: "50m"
